<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Paylaşım - JSON Gönder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .preview {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }

        .preview h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .preview img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        .preview p {
            color: #666;
            line-height: 1.6;
            margin-top: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Platform Grid - Modern Card Design */
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .platform-card {
            position: relative;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .platform-card:hover:not(.disabled) {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .platform-card.active {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.15);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .platform-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .platform-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .platform-checkbox:disabled {
            cursor: not-allowed;
        }

        .platform-info {
            flex: 1;
            min-width: 0;
        }

        .platform-icon {
            font-size: 1.8em;
            line-height: 1;
            margin-bottom: 4px;
        }

        .platform-name {
            font-weight: 600;
            font-size: 1em;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .platform-status {
            font-size: 0.8em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .platform-status.enabled {
            color: var(--success);
        }

        .platform-status.disabled {
            color: var(--error);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        .status-dot.offline {
            background: var(--error);
        }

        @media (max-width: 768px) {
            .platforms-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Facebook Paylaşım</h1>
        <p class="subtitle">JSON yapıştır, Facebook'ta paylaş</p>

        <textarea id="jsonInput" placeholder='{"ilan_turu": "Kayıp", "baslik": "...", "gorsel": "...", ...}'></textarea>

        <!-- Platform Selection -->
        <div style="margin: 25px 0;">
            <div style="font-weight: 600; font-size: 1.1em; margin-bottom: 15px; color: #f1f5f9;">📱 Platformlar Seç:</div>
            <div class="platforms-grid" id="platformsContainer">
                <!-- Dinamik yüklenecek -->
            </div>
        </div>

        <button class="btn" onclick="shareToFacebook()">🚀 Seçili Platformlarda Paylaş</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Paylaşılıyor...</p>
        </div>

        <div class="preview" id="preview"></div>
        <div class="result" id="result"></div>
    </div>

    <script>
        // API URL - Aynı domain kullan
        const API_URL = window.location.origin;  // Railway'de otomatik
        
        let platforms = {};
        let selectedPlatforms = [];

        // Sayfa yüklendiğinde platformları al
        document.addEventListener('DOMContentLoaded', async () => {
            await loadPlatforms();
        });

        async function loadPlatforms() {
            try {
                const response = await fetch(`${API_URL}/api/platforms`);
                platforms = await response.json();
                renderPlatforms();
            } catch (error) {
                console.error('Platform yükleme hatası:', error);
            }
        }

        function renderPlatforms() {
            const container = document.getElementById('platformsContainer');
            let html = '';
            
            Object.entries(platforms).forEach(([key, platform]) => {
                const disabled = !platform.enabled;
                const checked = platform.enabled ? 'checked' : '';
                const cardClass = platform.enabled ? 'active' : 'disabled';
                const statusClass = platform.enabled ? 'enabled' : 'disabled';
                const statusDot = platform.enabled ? 'online' : 'offline';
                const statusText = platform.enabled ? 'Hazır' : 'Yapılandırılmamış';
                
                html += `
                    <div class="platform-card ${cardClass}" onclick="${disabled ? '' : `togglePlatform('${key}')`}">
                        <input 
                            type="checkbox" 
                            class="platform-checkbox"
                            id="platform_${key}" 
                            value="${key}" 
                            ${checked} 
                            ${disabled ? 'disabled' : ''}
                            onchange="updateSelectedPlatforms()"
                        >
                        <div class="platform-info">
                            <div class="platform-icon">${platform.icon}</div>
                            <div class="platform-name">${platform.name}</div>
                            <div class="platform-status ${statusClass}">
                                <span class="status-dot ${statusDot}"></span>
                                ${statusText}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            updateSelectedPlatforms();
        }

        function togglePlatform(key) {
            const checkbox = document.getElementById(`platform_${key}`);
            if (checkbox && !checkbox.disabled) {
                checkbox.checked = !checkbox.checked;
                updateSelectedPlatforms();
            }
        }

        function updateSelectedPlatforms() {
            const checkboxes = document.querySelectorAll('#platformsContainer input[type="checkbox"]:checked');
            selectedPlatforms = Array.from(checkboxes).map(cb => cb.value);
            console.log('Seçili platformlar:', selectedPlatforms);
        }

        async function shareToFacebook() {
            const jsonInput = document.getElementById('jsonInput').value.trim();
            const resultDiv = document.getElementById('result');
            const previewDiv = document.getElementById('preview');
            const loadingDiv = document.getElementById('loading');
            const btn = document.querySelector('.btn');

            // Reset
            resultDiv.style.display = 'none';
            previewDiv.style.display = 'none';

            if (!jsonInput) {
                showError('Lütfen JSON verisini yapıştırın!');
                return;
            }

            try {
                // Parse JSON
                let data;
                try {
                    data = JSON.parse(jsonInput);
                } catch (e) {
                    showError('❌ Geçersiz JSON formatı! Lütfen kontrol edin.');
                    return;
                }

                // Array ise ilk elemanı al
                if (Array.isArray(data)) {
                    if (data.length === 0) {
                        showError('❌ JSON array boş!');
                        return;
                    }
                    data = data[0];
                }

                // Validate
                if (!data.baslik) {
                    showError('❌ JSON\'da "baslik" alanı zorunludur!');
                    return;
                }

                if (!data.gorsel) {
                    showError('❌ JSON\'da "gorsel" alanı zorunludur!');
                    return;
                }

                // Platform kontrolü
                if (selectedPlatforms.length === 0) {
                    showError('❌ Lütfen en az bir platform seçin!');
                    return;
                }

                // Show preview
                showPreview(data);

                // Disable button
                btn.disabled = true;
                loadingDiv.style.display = 'block';

                // Platform bilgisini ekle
                data.platforms = selectedPlatforms;

                // Send JSON to API (backend will download image)
                const response = await fetch(`${API_URL}/api/publish/json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    let successMsg = '✅ Başarıyla paylaşıldı!\n\n';
                    Object.entries(result.results || {}).forEach(([platform, res]) => {
                        if (res.status === 'success') {
                            successMsg += `${platforms[platform]?.icon || '✓'} ${platforms[platform]?.name || platform}: ✅\n`;
                        }
                    });
                    showSuccess(successMsg);
                } else {
                    let errorMsg = '⚠️ Paylaşım sonuçları:\n\n';
                    Object.entries(result.results || {}).forEach(([platform, res]) => {
                        const status = res.status === 'success' ? '✅' : '❌';
                        const msg = res.message || (res.status === 'success' ? 'Başarılı' : 'Hata');
                        errorMsg += `${platforms[platform]?.icon || '•'} ${platforms[platform]?.name || platform}: ${status} ${msg}\n`;
                    });
                    showError(errorMsg);
                }

            } catch (error) {
                showError('❌ Hata: ' + error.message);
            } finally {
                btn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        }

        function showPreview(data) {
            const previewDiv = document.getElementById('preview');
            previewDiv.innerHTML = `
                <h3>📋 Önizleme</h3>
                <p><strong>${data.baslik}</strong></p>
                ${data.aciklama ? `<p style="font-size: 0.9em;">${data.aciklama}</p>` : ''}
                ${data.konum ? `<p style="font-size: 0.85em;">📍 ${data.konum}</p>` : ''}
                <img src="${data.gorsel}" alt="Görsel" onerror="this.style.display='none'">
            `;
            previewDiv.style.display = 'block';
        }

        function showSuccess(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result success';
            resultDiv.textContent = message;
            resultDiv.style.display = 'block';
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result error';
            resultDiv.textContent = message;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
