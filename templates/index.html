<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPublish - Tek Tuşla Çoklu Paylaşım</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🚀 SocialPublish</h1>
            <p class="subtitle">Tek tuşla tüm sosyal medya platformlarında paylaşım yapın</p>
        </header>

        <!-- Main Form -->
        <div class="card">
            <form id="publishForm" enctype="multipart/form-data">
                <!-- Message Input -->
                <div class="form-group">
                    <label for="message">📝 Paylaşım Metni</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="5" 
                        placeholder="Ne paylaşmak istersiniz?"
                        required
                    ></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span> / 280 karakter
                    </div>
                </div>

                <!-- Image Upload -->
                <div class="form-group">
                    <label for="image">🖼️ Görsel Ekle (Opsiyonel)</label>
                    <div class="file-upload">
                        <input 
                            type="file" 
                            id="image" 
                            name="image" 
                            accept="image/*"
                            hidden
                        >
                        <button type="button" class="btn-upload" onclick="document.getElementById('image').click()">
                            📁 Dosya Seç
                        </button>
                        <span id="fileName" class="file-name">Dosya seçilmedi</span>
                    </div>
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <!-- Platform Selection -->
                <div class="form-group">
                    <label>📱 Platformlar</label>
                    <div class="platforms" id="platformsContainer">
                        <!-- Dinamik olarak yüklenecek -->
                        <div class="platform-loading">Platformlar yükleniyor...</div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="btnText">🚀 Tüm Platformlarda Paylaş</span>
                    <span id="btnLoading" class="loading" style="display: none;">
                        <span class="spinner"></span> Paylaşılıyor...
                    </span>
                </button>
            </form>
        </div>

        <!-- Results -->
        <div id="results" class="results" style="display: none;"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with ❤️ by SocialPublish | <a href="https://github.com" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
